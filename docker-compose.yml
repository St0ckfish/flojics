services:
  mysql:
    image: mysql:8.4
    container_name: flojics-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flojics
      MYSQL_USER: flojics
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: flojics-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: flojics
      PMA_PASSWORD: secret
    ports:
      - "8081:80"

volumes:
  mysql_data:
